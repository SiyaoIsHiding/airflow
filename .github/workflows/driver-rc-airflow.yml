name: cassandra-driver 3.31.0 RC vs Airflow cassandra provider

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  tests-providers-integration:
    timeout-minutes: 90
    name: "Integration: providers cassandra (driver: ${{ matrix.driver }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        driver: [baseline, rc-wheel]
    env:
      # COPIED [1], with the workflow inputs replaced by Airflow's defaults (python 3.11, postgres 14).
      BACKEND: "postgres"
      BACKEND_VERSION: "14"
      PYTHON_MAJOR_MINOR_VERSION: "3.11"
      JOB_ID: "integration-providers-cassandra-${{ matrix.driver }}"
      SKIP_PROVIDERS_TESTS: "false"
      ENABLE_COVERAGE: "false"
      DEBUG_RESOURCES: "false"
      # CHANGED: Airflow uses github.repository; fixed here so Breeze pulls Airflow's image cache
      # when this runs outside apache/airflow.
      GITHUB_REPOSITORY: apache/airflow
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      VERBOSE: "true"
      # ADDED: the release candidate under test.
      DRIVER_VERSION: "3.31.0"
      WHEEL_URL: "https://dist.apache.org/repos/dist/dev/cassandra/cassandra-python-driver/3.31.0/wheels/cassandra_driver-3.31.0-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl"
      WHEEL: "cassandra_driver-3.31.0-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl"
      WHEEL_SHA256: "64598047a2da17ad72a837158f95f06ea708eaca0d4be7d695983c77fa526aa3"
    steps:
      # COPIED [1]
      - name: "Cleanup repo"
        shell: bash
        run: sudo rm -rf ${GITHUB_WORKSPACE}/*
      # COPIED [1]; CHANGED to check out apache/airflow at a pinned commit instead of this repository.
      - name: "Checkout apache/airflow 715043b898089c40053108246a0e549f9c16c982"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: apache/airflow
          ref: 715043b898089c40053108246a0e549f9c16c982
          persist-credentials: false
      # COPIED [2]
      - name: "Make /mnt writeable and cleanup"
        shell: bash
        run: ./scripts/ci/make_mnt_writeable.sh
      # COPIED [2]
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
        id: breeze
      # COPIED [3]. Airflow's test job loads an image stashed by its build job; this workflow has no
      # build job, so it builds the image here with the same two steps the build job uses.
      - name: "Login to ghcr.io"
        env:
          ACTOR: ${{ github.actor }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${ACTOR} --password-stdin
      - name: "Build linux/amd64:${{ env.PYTHON_MAJOR_MINOR_VERSION }} image"
        run: breeze ci-image build --platform "${PLATFORM}"
        env:
          PLATFORM: "linux/amd64"
      # ADDED: Airflow's CI has no way to swap one dependency. BREEZE_INIT_COMMAND is Breeze's documented
      # hook (dev/breeze/doc/02_customizing.rst), evaluated inside the test container before tests run.
      # It installs the staged wheel after checking its SHA-256, and aborts the container if the
      # expected driver version is not the one imported.
      - name: "Select driver: ${{ matrix.driver }}"
        shell: bash
        run: |
          SHOW="python -c 'import cassandra; print(\"DRIVER UNDER TEST:\", cassandra.__version__)'"
          if [[ "${{ matrix.driver }}" == "baseline" ]]; then
            INIT="${SHOW} || exit 1"
          else
            INIT="curl -fsSL -o /tmp/${WHEEL} ${WHEEL_URL}"
            INIT+=" && echo '${WHEEL_SHA256}  /tmp/${WHEEL}' | sha256sum -c -"
            INIT+=" && uv pip install --reinstall-package cassandra-driver /tmp/${WHEEL}"
            INIT+=" && python -c 'import cassandra; assert cassandra.__version__ == \"${DRIVER_VERSION}\", cassandra.__version__'"
            INIT+=" && ${SHOW} || exit 1"
          fi
          echo "BREEZE_INIT_COMMAND=${INIT}" >> "${GITHUB_ENV}"
      # ADDED: Airflow runs provider unit tests in a separate job (run-unit-tests.yml) over all providers.
      # This is the documented single-provider form (contributing-docs/testing/unit_tests.rst).
      - name: "Unit: providers apache.cassandra"
        run: breeze testing providers-tests --test-type "Providers[apache.cassandra]"
      # COPIED [1], with the matrix value fixed to cassandra.
      - name: "Integration: providers cassandra"
        env:
          INTEGRATION: "cassandra"
        run: ./scripts/ci/testing/run_integration_tests_with_retry.sh providers "${INTEGRATION}"
      # COPIED [1]
      - name: "Post Tests failure"
        uses: ./.github/actions/post_tests_failure
        if: failure()
